; SlimeVR-lite USB dongle: a D1 mini that relays the ESP-NOW trackers
; (the SLIMELITE_D1MINI tracker firmware, which looks for it at boot) to the PC over USB serial.
[env:dongle]
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags = -O2
